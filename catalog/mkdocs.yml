site_name: Genetec Security Center Macros
site_description: Practical, field-tested Genetec Security Center macros, shared for security teams.
site_author: Matthew Netardus
# site_url: set this to your published address once hosting is connected.

docs_dir: docs
site_dir: site

copyright: Aurora Nexus&trade; 2026

theme:
  name: material
  icon:
    logo: material/shield-lock-outline
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark is the default, in keeping with the technical look.
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  # Removes the "Made with Material for MkDocs" line from the footer.
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
